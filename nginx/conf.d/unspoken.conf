# nginx reverse proxy for unspoken. Terminates TLS with a Cloudflare Origin
# Certificate and proxies to the app container. Cloudflare stays in front
# (orange cloud, Full strict), so real client IPs arrive in CF-Connecting-IP
# and must be restored, otherwise every visitor looks like a Cloudflare IP and
# the app's per-visitor rate limiting / anonymity hashing would key off the CDN.

# --- Restore the real client IP from Cloudflare -----------------------------
# Refresh these from https://www.cloudflare.com/ips/ if Cloudflare changes them.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Upstream app (compose service name on the private network).
upstream unspoken_app {
    server app:3000;
    keepalive 32;
}

# Port 80: redirect to https. Cloudflare already serves https to users; this
# covers any plaintext origin pull and direct hits.
server {
    listen 80;
    listen [::]:80;
    server_name unspoken.zone www.unspoken.zone;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name unspoken.zone www.unspoken.zone;

    # Cloudflare Origin Certificate (15-year, no renewal). Placed on the VM at
    # ./nginx/certs, mounted read-only. Never committed to git.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # The app caps API bodies at 64KB; reject anything larger before it hits it.
    client_max_body_size 128k;

    # Realtime SSE: no buffering, long-lived, keep chunks flowing.
    location /api/stream {
        proxy_pass http://unspoken_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://unspoken_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
