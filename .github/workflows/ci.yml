name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck / test / build
    runs-on: ubuntu-latest
    env:
      # Dummy values so env validation + tests run without real secrets.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      IP_SALT: ci-dummy-salt-0123456789abcdef
      PUBLIC_SITE_URL: https://unspoken.zone
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Production build
        run: bun run build

  deploy:
    name: Deploy to production
    needs: check
    # Only real pushes to main deploy; PRs and forks never do.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never let two deploys race on the box.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" \
            || { echo "Missing DEPLOY_* secrets; add them in repo Settings > Secrets."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd ~/unspoken
             git pull --ff-only
             docker compose up -d --build
             docker image prune -f'
